name: build workflow
on: 
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup jdk 17
        uses: actions/setup-java@v3   
        with:
          distribution: "temurin"
          java-version: '17'
          cache: maven

      - name: build codebase
        run: mvn clean package -DskipTests     

      - name: run tests
        run: mvn test  